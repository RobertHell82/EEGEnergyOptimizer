<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="pvGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="feedGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="feedGreenB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="batGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="555" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="600">Verzögerte Batterieladung — Warum?</text>

  <!-- ==================== SCENARIO A: Without ==================== -->
  <text x="50" y="72" fill="#ef5350" font-size="14" font-weight="600">Ohne Verzögerung</text>
  <text x="750" y="72" text-anchor="end" fill="#9e9e9e" font-size="11">Einspeisung erst ab Mittag</text>

  <g transform="translate(50, 80)">
    <!-- Grid -->
    <rect width="700" height="160" rx="8" fill="#0d1117" stroke="#333" stroke-width="0.5"/>
    <!-- Time axis labels -->
    <text x="0" y="175" fill="#888" font-size="10" text-anchor="middle">06:00</text>
    <text x="116" y="175" fill="#888" font-size="10" text-anchor="middle">08:00</text>
    <text x="233" y="175" fill="#888" font-size="10" text-anchor="middle">10:00</text>
    <text x="350" y="175" fill="#888" font-size="10" text-anchor="middle">12:00</text>
    <text x="466" y="175" fill="#888" font-size="10" text-anchor="middle">14:00</text>
    <text x="583" y="175" fill="#888" font-size="10" text-anchor="middle">16:00</text>
    <text x="700" y="175" fill="#888" font-size="10" text-anchor="middle">18:00</text>
    <!-- Vertical grid lines -->
    <line x1="116" y1="0" x2="116" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="233" y1="0" x2="233" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="350" y1="0" x2="350" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="466" y1="0" x2="466" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="583" y1="0" x2="583" y2="160" stroke="#222" stroke-width="0.5"/>

    <!-- PV production curve (bell shape 06-18) -->
    <path d="M0,160 C50,155 100,120 175,70 C250,20 300,8 350,5 C400,8 450,20 525,70 C600,120 650,155 700,160 Z" fill="url(#pvGrad)" opacity="0.4"/>
    <path d="M0,160 C50,155 100,120 175,70 C250,20 300,8 350,5 C400,8 450,20 525,70 C600,120 650,155 700,160" fill="none" stroke="#FFB300" stroke-width="2"/>

    <!-- Battery charges immediately: SOC line rises fast 06:00-11:00 -->
    <path d="M0,130 C30,125 80,90 140,55 C200,25 240,15 280,12 L280,12" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Battery full, stays flat -->
    <path d="M280,12 L700,12" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- Feed-in only after battery full (from ~11:00 onwards) -->
    <path d="M280,160 C320,140 370,80 420,40 C440,28 460,25 466,25 C472,25 520,40 560,70 C620,115 660,150 700,160 Z" fill="url(#feedGreen)" opacity="0.5"/>

    <!-- SOC labels -->
    <text x="285" y="10" fill="#2196F3" font-size="10" font-weight="600">100%</text>
    <text x="-5" y="127" fill="#2196F3" font-size="9" text-anchor="end">SOC</text>

    <!-- Arrows / annotations -->
    <text x="140" y="100" fill="#2196F3" font-size="10" opacity="0.8">Batterie lädt</text>
    <text x="450" y="100" fill="#4CAF50" font-size="10" font-weight="500">Einspeisung</text>

    <!-- Red X mark on morning -->
    <text x="70" y="145" fill="#ef5350" font-size="16" font-weight="bold" opacity="0.7">keine Einspeisung</text>
  </g>

  <!-- ==================== SCENARIO B: With delay ==================== -->
  <text x="50" y="302" fill="#4CAF50" font-size="14" font-weight="600">Mit Verzögerung (EEG Optimizer)</text>
  <text x="750" y="302" text-anchor="end" fill="#9e9e9e" font-size="11">Einspeisung ab Sonnenaufgang</text>

  <g transform="translate(50, 310)">
    <!-- Grid -->
    <rect width="700" height="160" rx="8" fill="#0d1117" stroke="#333" stroke-width="0.5"/>
    <!-- Time axis labels -->
    <text x="0" y="175" fill="#888" font-size="10" text-anchor="middle">06:00</text>
    <text x="116" y="175" fill="#888" font-size="10" text-anchor="middle">08:00</text>
    <text x="233" y="175" fill="#888" font-size="10" text-anchor="middle">10:00</text>
    <text x="350" y="175" fill="#888" font-size="10" text-anchor="middle">12:00</text>
    <text x="466" y="175" fill="#888" font-size="10" text-anchor="middle">14:00</text>
    <text x="583" y="175" fill="#888" font-size="10" text-anchor="middle">16:00</text>
    <text x="700" y="175" fill="#888" font-size="10" text-anchor="middle">18:00</text>
    <!-- Vertical grid lines -->
    <line x1="116" y1="0" x2="116" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="233" y1="0" x2="233" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="350" y1="0" x2="350" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="466" y1="0" x2="466" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="583" y1="0" x2="583" y2="160" stroke="#222" stroke-width="0.5"/>

    <!-- Blocked zone indicator (06:00 - 10:00) -->
    <rect x="0" y="0" width="233" height="160" fill="#ef5350" opacity="0.06" rx="4"/>
    <line x1="233" y1="0" x2="233" y2="160" stroke="#ef5350" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="116" y="152" text-anchor="middle" fill="#ef5350" font-size="9" opacity="0.7">Ladung blockiert</text>

    <!-- PV production curve (same bell shape) -->
    <path d="M0,160 C50,155 100,120 175,70 C250,20 300,8 350,5 C400,8 450,20 525,70 C600,120 650,155 700,160 Z" fill="url(#pvGrad)" opacity="0.4"/>
    <path d="M0,160 C50,155 100,120 175,70 C250,20 300,8 350,5 C400,8 450,20 525,70 C600,120 650,155 700,160" fill="none" stroke="#FFB300" stroke-width="2"/>

    <!-- Feed-in starts immediately from 06:00 until 10:00 (all PV goes to grid) -->
    <path d="M0,160 C50,155 100,120 175,70 C220,40 233,32 233,32 L233,160 Z" fill="url(#feedGreenB)" opacity="0.6"/>
    <!-- Feed-in also in afternoon (excess after battery full) -->
    <path d="M466,160 C440,140 430,100 430,60 C430,30 440,25 466,25 C490,25 520,40 560,70 C620,115 660,150 700,160 Z" fill="url(#feedGreenB)" opacity="0.5"/>

    <!-- Battery SOC: flat until 10:00, then charges 10:00-14:00 -->
    <path d="M0,130 L233,130" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M233,130 C280,100 350,40 430,15 C450,12 466,12 466,12" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Battery full, stays flat -->
    <path d="M466,12 L700,12" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- SOC labels -->
    <text x="472" y="10" fill="#2196F3" font-size="10" font-weight="600">100%</text>

    <!-- Annotations -->
    <text x="80" y="55" fill="#4CAF50" font-size="10" font-weight="500">Einspeisung</text>
    <text x="310" y="100" fill="#2196F3" font-size="10" opacity="0.8">Batterie lädt</text>
    <text x="550" y="100" fill="#4CAF50" font-size="10" font-weight="500">Einspeisung</text>
  </g>

  <!-- Legend -->
  <g transform="translate(180, 500)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#FFB300" stroke-width="2"/>
    <text x="30" y="4" fill="#bbb" font-size="11">PV-Erzeugung</text>

    <line x1="140" y1="0" x2="164" y2="0" stroke="#2196F3" stroke-width="2.5"/>
    <text x="170" y="4" fill="#bbb" font-size="11">Batterie SOC</text>

    <rect x="290" y="-6" width="24" height="12" rx="2" fill="#4CAF50" opacity="0.6"/>
    <text x="320" y="4" fill="#bbb" font-size="11">Einspeisung ins Netz</text>
  </g>

  <!-- Explanation text -->
  <text x="400" y="540" text-anchor="middle" fill="#9e9e9e" font-size="11">Morgens ist die Nachfrage höher — mehr Strom wird innerhalb der EEG abgenommen und die Einspeisung ist netzdienlich.</text>
</svg>
