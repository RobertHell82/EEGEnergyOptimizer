<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="feedGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="consumeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5350" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef5350" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="reserveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196F3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2196F3" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="555" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="600">Nacht-Entladung — Nur der Überschuss wird eingespeist</text>

  <!-- ==================== SCENARIO A: Without Optimizer ==================== -->
  <text x="50" y="72" fill="#ef5350" font-size="14" font-weight="600">Ohne Optimizer</text>
  <text x="750" y="72" text-anchor="end" fill="#9e9e9e" font-size="11">Überschüssige Energie bleibt ungenutzt in der Batterie</text>

  <g transform="translate(50, 80)">
    <!-- Grid -->
    <rect width="700" height="160" rx="8" fill="#0d1117" stroke="#333" stroke-width="0.5"/>
    <!-- Time axis -->
    <text x="0" y="175" fill="#888" font-size="10" text-anchor="middle">18:00</text>
    <text x="100" y="175" fill="#888" font-size="10" text-anchor="middle">20:00</text>
    <text x="200" y="175" fill="#888" font-size="10" text-anchor="middle">22:00</text>
    <text x="300" y="175" fill="#888" font-size="10" text-anchor="middle">00:00</text>
    <text x="400" y="175" fill="#888" font-size="10" text-anchor="middle">02:00</text>
    <text x="500" y="175" fill="#888" font-size="10" text-anchor="middle">04:00</text>
    <text x="600" y="175" fill="#888" font-size="10" text-anchor="middle">06:00</text>
    <text x="700" y="175" fill="#888" font-size="10" text-anchor="middle">08:00</text>
    <!-- Vertical grid lines -->
    <line x1="100" y1="0" x2="100" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="160" stroke="#222" stroke-width="0.5"/>

    <!-- Consumption bar (flat ~2kW overnight, visual as subtle area) -->
    <rect x="0" y="120" width="700" height="40" rx="2" fill="url(#consumeGrad)" opacity="0.4"/>
    <text x="350" y="145" text-anchor="middle" fill="#ef5350" font-size="9" opacity="0.8">Hausverbrauch</text>

    <!-- Battery SOC: starts at 95%, slowly drops to ~75% by self-use overnight -->
    <path d="M0,15 C100,18 200,30 300,45 C400,55 500,62 600,68 L700,72" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>

    <!-- SOC labels -->
    <text x="-5" y="13" fill="#2196F3" font-size="9" text-anchor="end">95%</text>
    <text x="705" y="70" fill="#2196F3" font-size="9">~75%</text>

    <!-- Annotation: energy stays trapped -->
    <text x="350" y="85" text-anchor="middle" fill="#ff9800" font-size="11" font-weight="500">Überschuss bleibt in der Batterie</text>
    <text x="350" y="100" text-anchor="middle" fill="#9e9e9e" font-size="9">Energie wird morgen durch neue PV-Ladung „überschrieben"</text>
  </g>

  <!-- ==================== SCENARIO B: With Optimizer ==================== -->
  <text x="50" y="302" fill="#4CAF50" font-size="14" font-weight="600">Mit Optimizer (Nacht-Entladung)</text>
  <text x="750" y="302" text-anchor="end" fill="#9e9e9e" font-size="11">Überschuss wird ins Netz eingespeist, Eigenbedarf bleibt gesichert</text>

  <g transform="translate(50, 310)">
    <!-- Grid -->
    <rect width="700" height="160" rx="8" fill="#0d1117" stroke="#333" stroke-width="0.5"/>
    <!-- Time axis -->
    <text x="0" y="175" fill="#888" font-size="10" text-anchor="middle">18:00</text>
    <text x="100" y="175" fill="#888" font-size="10" text-anchor="middle">20:00</text>
    <text x="200" y="175" fill="#888" font-size="10" text-anchor="middle">22:00</text>
    <text x="300" y="175" fill="#888" font-size="10" text-anchor="middle">00:00</text>
    <text x="400" y="175" fill="#888" font-size="10" text-anchor="middle">02:00</text>
    <text x="500" y="175" fill="#888" font-size="10" text-anchor="middle">04:00</text>
    <text x="600" y="175" fill="#888" font-size="10" text-anchor="middle">06:00</text>
    <text x="700" y="175" fill="#888" font-size="10" text-anchor="middle">08:00</text>
    <!-- Vertical grid lines -->
    <line x1="100" y1="0" x2="100" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="160" stroke="#222" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="160" stroke="#222" stroke-width="0.5"/>

    <!-- Discharge zone (20:00 - ~23:00) -->
    <rect x="100" y="0" width="175" height="160" fill="#4CAF50" opacity="0.06" rx="4"/>

    <!-- Feed-in area during discharge -->
    <path d="M100,160 L100,40 L275,40 L275,160 Z" fill="url(#feedGreen)" opacity="0.5"/>
    <text x="187" y="30" text-anchor="middle" fill="#4CAF50" font-size="10" font-weight="500">Einspeisung</text>

    <!-- Reserve zone: Min-SOC area at bottom -->
    <rect x="275" y="95" width="425" height="65" rx="2" fill="url(#reserveGrad)" opacity="0.5"/>
    <text x="487" y="132" text-anchor="middle" fill="#2196F3" font-size="9" opacity="0.9">Reserve für Nachtverbrauch + Puffer</text>

    <!-- Consumption bar -->
    <rect x="275" y="120" width="425" height="40" rx="2" fill="url(#consumeGrad)" opacity="0.4"/>
    <text x="487" y="150" text-anchor="middle" fill="#ef5350" font-size="9" opacity="0.8">Hausverbrauch</text>

    <!-- Min-SOC line (dashed) -->
    <line x1="100" y1="95" x2="700" y2="95" stroke="#2196F3" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>
    <text x="705" y="93" fill="#2196F3" font-size="9">Ziel-SOC</text>

    <!-- Battery SOC line -->
    <!-- 18-20: stays at 95% -->
    <path d="M0,15 L100,15" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 20-23: drops fast during discharge to Min-SOC -->
    <path d="M100,15 C140,25 200,60 275,95" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 23-08: slowly drops from Min-SOC through self-use -->
    <path d="M275,95 C350,105 500,118 600,128 L700,135" fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>

    <!-- SOC labels -->
    <text x="-5" y="13" fill="#2196F3" font-size="9" text-anchor="end">95%</text>
    <text x="705" y="140" fill="#2196F3" font-size="9" opacity="0.7">Min-SOC</text>
  </g>

  <!-- Legend -->
  <g transform="translate(120, 500)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#2196F3" stroke-width="2.5"/>
    <text x="30" y="4" fill="#bbb" font-size="11">Batterie SOC</text>

    <rect x="140" y="-6" width="24" height="12" rx="2" fill="#4CAF50" opacity="0.6"/>
    <text x="170" y="4" fill="#bbb" font-size="11">Einspeisung ins Netz</text>

    <rect x="310" y="-6" width="24" height="12" rx="2" fill="#ef5350" opacity="0.5"/>
    <text x="340" y="4" fill="#bbb" font-size="11">Hausverbrauch</text>

    <rect x="450" y="-6" width="24" height="12" rx="2" fill="#2196F3" opacity="0.3"/>
    <text x="480" y="4" fill="#bbb" font-size="11">Reserve (dynamisch berechnet)</text>
  </g>

  <!-- Explanation text -->
  <text x="400" y="540" text-anchor="middle" fill="#9e9e9e" font-size="11">Es wird nur die Energie eingespeist, die über den berechneten Nachtbedarf hinausgeht — der Eigenbedarf bleibt immer gesichert.</text>
</svg>
