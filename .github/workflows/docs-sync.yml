name: Docs Sync Check

# Stellt sicher, dass docs/guides/ (Single Source of Truth) und die generierten
# Panel-Anleitungen in custom_components/.../frontend/guide/ synchron sind.
# Bei Abweichung: python scripts/build_guides.py ausführen und committen.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python scripts/build_guides.py --check
